name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (v6 for SDK 37)
        uses: amyu/setup-android@v6
        with:
          sdk-version: 37

      - name: Setup Gradle 9.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealmeOtc-APK
          path: app/build/outputs/apk/debug/*.apk
